[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-to-sql"
version = "0.1.0"
description = "NL-to-SQL over SQLite scored by execution accuracy (not string match), benchmarking zero-shot / few-shot / self-correction strategies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taimour Abdul Karim", email = "taimour.a.karim@gmail.com" }]
keywords = ["text-to-sql", "nl2sql", "llm", "evaluation", "execution-accuracy", "agents"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
claude = ["anthropic>=0.40", "python-dotenv>=1.0"]
bedrock = ["anthropic[bedrock]>=0.40", "python-dotenv>=1.0"]

[project.scripts]
text-to-sql = "text2sql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
